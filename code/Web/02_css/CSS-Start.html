<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Start</title>
    <!-- CSS 참조방식 3. 링크방식 : link를 통해 외부 CSS파일과 연결 -->
    <link rel="stylesheet" href="./CSS-Start.css" />

    <!-- CSS 참조방식 2. 내장방식 : head안의 style를 통해 CSS를 작성-->
    <style>
      body {
        margin: 0;
      }
      h1,
      h2 {
        color: crimson;
      }
      ul {
        background-color: aquamarine;
      }
      li {
        color: darkblue;
      }
    </style>
  </head>
  <body>
    <!-- CSS 참조방식 1. 인라인 : 태그 안에 쓰는 방식-->
    <h1 style="color: blue">CSS 공부를 시작해요!</h1>
    <h2>CSS는 HTML로 구성된 웹페이지를 꾸며줍니다.</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>Javascript</li>
    </ul>
  </body>
</html>
