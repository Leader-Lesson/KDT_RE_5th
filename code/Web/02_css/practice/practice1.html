<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow</title>
    <style>
      #red {
        background-color: red;
        width: 50px;
        height: 50px;
      }
      #orange {
        background-color: orange;
        width: 100px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div id="red"></div>
    <div id="orange"></div>
    <div
      id="yellow"
      style="background-color: yellow; width: 150px; height: 50px"
    ></div>
    <div
      id="green"
      style="background-color: green; width: 200px; height: 50px"
    ></div>
    <div
      id="blue"
      style="background-color: blue; width: 250px; height: 50px"
    ></div>
    <div
      id="darkblue"
      style="background-color: darkblue; width: 300px; height: 50px"
    ></div>
    <div
      id="purple"
      style="background-color: purple; width: 350px; height: 50px"
    ></div>
  </body>
</html>
